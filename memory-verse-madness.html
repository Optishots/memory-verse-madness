<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Verse Madness 📖✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #319795;
            min-height: 100vh;
            padding: 20px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.5em;
            color: #2d7878;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 20px;
        }

        .search-section {
            background: #f7fafc;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 3px solid #e2e8f0;
        }

        .search-title {
            font-size: 1.4em;
            color: #4a5568;
            margin-bottom: 15px;
            text-align: center;
        }

        .search-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .search-input {
            padding: 12px 15px;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            min-width: 120px;
        }

        .search-input:focus {
            outline: none;
            border-color: #319795;
            box-shadow: 0 0 0 3px rgba(49, 151, 149, 0.1);
        }

        .search-btn {
            background: #319795;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #2d7878;
            transform: translateY(-2px);
        }

        .game-section {
            display: none;
            text-align: center;
        }

        .verse-display {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #e2e8f0;
            margin-bottom: 25px;
            font-size: 1.3em;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .verse-text {
            margin-bottom: 15px;
        }

        .verse-reference {
            font-weight: bold;
            color: #319795;
            font-size: 1.1em;
        }

        .blank-input {
            background: #fef5e7;
            border: 2px solid #f6ad55;
            border-radius: 8px;
            padding: 8px 12px;
            margin: 0 3px;
            font-size: 1.1em;
            font-weight: bold;
            color: #744210;
            min-width: 60px;
            max-width: 120px;
            text-align: center;
            display: inline-block;
        }

        .blank-input:focus {
            outline: none;
            border-color: #ed8936;
            box-shadow: 0 0 0 3px rgba(237, 137, 54, 0.2);
        }

        .blank-input.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .blank-input.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Dancing Cupcakes */
        .dancing-cupcake {
            position: fixed;
            font-size: 6em;
            z-index: 1000;
            cursor: pointer;
            animation: cupcake-dance 3s ease-in-out infinite;
            user-select: none;
        }

        /* Dancing Unicorns */
        .dancing-unicorn {
            position: fixed;
            font-size: 6em;
            z-index: 1000;
            cursor: pointer;
            animation: unicorn-dance 3.5s ease-in-out infinite;
            user-select: none;
        }

        .emoji-popped {
            animation: emoji-pop 0.5s ease-out forwards;
        }

        @keyframes emoji-pop {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(2) rotate(360deg); opacity: 0; }
        }

        .emoji-spin {
            animation: emoji-spin 0.8s ease-out forwards;
        }

        @keyframes emoji-spin {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 1; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }

        .emoji-bounce {
            animation: emoji-bounce 0.6s ease-out forwards;
        }

        @keyframes emoji-bounce {
            0% { transform: scale(1) translateY(0px); opacity: 1; }
            25% { transform: scale(1.2) translateY(-20px); }
            50% { transform: scale(1.1) translateY(-10px); }
            75% { transform: scale(1.2) translateY(-15px); }
            100% { transform: scale(0) translateY(0px); opacity: 0; }
        }

        .emoji-sparkle {
            animation: emoji-sparkle 0.7s ease-out forwards;
        }

        @keyframes emoji-sparkle {
            0% { transform: scale(1); opacity: 1; filter: brightness(1); }
            33% { transform: scale(1.4); filter: brightness(2); }
            66% { transform: scale(1.2); filter: brightness(1.5); }
            100% { transform: scale(0); opacity: 0; filter: brightness(1); }
        }

        .emoji-scale {
            animation: emoji-scale 0.5s ease-out forwards;
        }

        @keyframes emoji-scale {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        .trophy-hunt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .trophy-hunt-message {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.5em;
            color: #319795;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .game-timer {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 2em;
            font-weight: bold;
            color: #e53e3e;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            display: none;
        }

        .instruction-timer {
            font-size: 3em;
            font-weight: bold;
            color: #319795;
            margin: 20px 0;
        }

        @keyframes unicorn-dance {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            20% { transform: translateY(-40px) rotate(10deg) scale(1.15); }
            40% { transform: translateY(-15px) rotate(-8deg) scale(1.25); }
            60% { transform: translateY(-35px) rotate(12deg) scale(1.1); }
            80% { transform: translateY(-20px) rotate(-5deg) scale(1.2); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }

        @keyframes cupcake-dance {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-30px) rotate(-15deg) scale(1.1); }
            50% { transform: translateY(-10px) rotate(15deg) scale(1.2); }
            75% { transform: translateY(-25px) rotate(-10deg) scale(1.1); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }

        .game-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .game-btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .game-btn:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .game-btn.secondary {
            background: #a0aec0;
        }

        .game-btn.secondary:hover {
            background: #718096;
        }

        .score {
            font-size: 1.2em;
            font-weight: bold;
            color: #319795;
            margin-bottom: 15px;
        }

        .hint {
            background: #bee3f8;
            color: #2c5282;
            padding: 10px 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 15px 0;
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding: 10px;
            }
            
            .container {
                padding: 20px;
            }
            
            .title {
                font-size: 2em;
            }
            
            .search-form {
                flex-direction: column;
            }
            
            .search-input {
                width: 100%;
            }
            
            .verse-display {
                font-size: 1.1em;
                padding: 20px;
                line-height: 1.8;
            }
            
            .blank-input {
                font-size: 1em;
                padding: 6px 8px;
                margin: 2px;
                min-width: 50px;
                max-width: 80px;
            }
            
            .dancing-cupcake, .dancing-unicorn {
                font-size: 3em;
            }
            
            .home-icon {
                font-size: 1.5em !important;
                padding: 8px !important;
            }
        }
        
        .home-icon {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #319795;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: #319795;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1002;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .home-icon:hover {
            background: #319795;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <!-- Home Icon -->
    <a href="index.html" class="home-icon" title="Back to Home">🏠</a>
    
    <div class="container">
        <div class="header">
            <h1 class="title">Memory Verse Madness 📖✨</h1>
            <p class="subtitle">                        Master Bible verses through fill-in-the-blank gameplay, then celebrate with an explosive emoji escape challenge!</p>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <h2 class="search-title">🔍 Enter a Bible Verse</h2>
            <form class="search-form" id="verseSearchForm">
                <input type="text" class="search-input" id="bookInput" placeholder="Book (e.g., John)" required>
                <input type="number" class="search-input" id="chapterInput" placeholder="Chapter" min="1" required>
                <input type="text" class="search-input" id="verseInput" placeholder="Verse (e.g., 16 or 1-3)" required>
                <select class="search-input" id="translationSelect">
                    <option value="kjv">KJV</option>
                    <option value="esv" selected>ESV</option>
                    <option value="web">WEB</option>
                    <option value="asv">ASV</option>
                    <option value="ylt">YLT</option>
                </select>
                <button type="submit" class="search-btn">🎮 Start Game!</button>
            </form>
            <div class="hint">
                💡 Try: John 3:16, Psalms 23:1, or Proverbs 3:5
            </div>
        </div>

        <!-- Game Section -->
        <div class="game-section" id="gameSection">
            <div class="score" id="scoreDisplay">Score: 0 / 0</div>
            
            <div class="verse-display" id="verseDisplay">
                <div class="verse-text" id="verseText"></div>
                <div class="verse-reference" id="verseReference"></div>
            </div>

            <div class="game-controls">
                <button class="game-btn" id="checkAnswersBtn" onclick="checkAnswers()">✅ Check Answers</button>
                <button class="game-btn" id="showHintBtn" onclick="showHint()">💡 Show Hint</button>
                <button class="game-btn secondary" onclick="goBackToSearch()">🔍 Different Verse</button>
            </div>
        </div>

        <!-- Loading/Error States -->
        <div class="loading" id="loadingState" style="display: none;">
            🔄 Loading your verse...
        </div>
        
        <div class="error" id="errorState" style="display: none;">
            ❌ <span id="errorMessage"></span>
        </div>

        <!-- Trophy Hunt Overlay -->
        <div class="trophy-hunt-overlay" id="trophyHuntOverlay">
            <div class="trophy-hunt-message" id="huntMessage">
                <div>🏆 Get Ready! 🏆</div>
                <div>Pop all the emojis!</div>
                <div class="instruction-timer" id="instructionTimer">5</div>
            </div>
        </div>
        
        <!-- Game Timer (appears during game) -->
        <div class="game-timer" id="gameTimer">10</div>
    </div>

    <script>
        let currentVerse = null;
        let gameData = {
            blanks: [],
            answers: [],
            score: 0,
            total: 0,
            hintsUsed: 0
        };

        // Form submission handler
        document.getElementById('verseSearchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Initialize audio on first user interaction
            initAudioContext();
            
            const book = document.getElementById('bookInput').value.trim();
            const chapter = document.getElementById('chapterInput').value.trim();
            const verse = document.getElementById('verseInput').value.trim();
            const translation = document.getElementById('translationSelect').value;
            
            if (!book || !chapter || !verse) {
                showError('Please fill in all fields');
                return;
            }

            await fetchVerse(book, chapter, verse, translation);
        });

        async function fetchVerse(book, chapter, verse, translation) {
            showLoading(true);
            hideError();
            
            try {
                let data;
                
                if (translation === 'esv') {
                    // ESV API integration
                    data = await fetchESVVerse(book, chapter, verse);
                } else {
                    // Bible-API.com for other translations
                    const query = `${book} ${chapter}:${verse}`;
                    const url = `https://bible-api.com/${encodeURIComponent(query)}?translation=${translation}`;
                    
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error('Verse not found. Please check your reference.');
                    }
                    
                    data = await response.json();
                }
                
                if (!data.text || data.text.trim() === '') {
                    throw new Error('No text found for this verse reference.');
                }
                
                currentVerse = data;
                startGame();
                
            } catch (error) {
                console.error('Error fetching verse:', error);
                showError(error.message || 'Failed to fetch verse. Please try again.');
            } finally {
                showLoading(false);
            }
        }

        async function fetchESVVerse(book, chapter, verse) {
            // ESV API configuration
            const ESV_API_KEY = '451f216395517e9d9e42b2d8c73375da91087949'; // Your ESV API key
            const ESV_API_URL = 'https://api.esv.org/v3/passage/text/';
            
            const query = `${book} ${chapter}:${verse}`;
            const url = `${ESV_API_URL}?q=${encodeURIComponent(query)}&include-headings=false&include-footnotes=false&include-verse-numbers=false&include-short-copyright=false&include-passage-references=false`;
            
            const response = await fetch(url, {
                headers: {
                    'Authorization': `Token ${ESV_API_KEY}`
                }
            });
            
            if (!response.ok) {
                throw new Error('ESV verse not found. Please check your reference.');
            }
            
            const result = await response.json();
            
            if (!result.passages || result.passages.length === 0) {
                throw new Error('No ESV text found for this verse reference.');
            }
            
            // Format to match Bible-API.com structure
            return {
                text: result.passages[0].trim(),
                reference: `${book} ${chapter}:${verse} (ESV)`
            };
        }

        function startGame() {
            // Hide search section and show game
            document.querySelector('.search-section').style.display = 'none';
            document.getElementById('gameSection').style.display = 'block';
            
            // Setup game data
            setupGameData();
            
            // Display the verse with blanks
            displayVerseWithBlanks();
            
            // Update score display
            updateScore();
        }

        function setupGameData() {
            const text = currentVerse.text.trim();
            const words = text.split(/\s+/);
            
            // Remove punctuation for processing but keep original words
            const cleanWords = words.map(word => word.replace(/[^\w']/g, '').toLowerCase());
            
            // Select words to blank out (avoid short words and common words)
            const skipWords = ['the', 'and', 'a', 'an', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by', 'is', 'are', 'was', 'were', 'be', 'been', 'have', 'has', 'had'];
            const blankIndices = [];
            
            // Blank out 20-30% of meaningful words
            const targetBlanks = Math.max(2, Math.floor(words.length * 0.25));
            
            for (let i = 0; i < words.length && blankIndices.length < targetBlanks; i++) {
                const cleanWord = cleanWords[i];
                if (cleanWord.length > 2 && !skipWords.includes(cleanWord)) {
                    if (Math.random() > 0.4) { // 60% chance to blank meaningful words
                        blankIndices.push(i);
                    }
                }
            }
            
            // Ensure we have at least 2 blanks
            if (blankIndices.length < 2) {
                for (let i = 0; i < words.length && blankIndices.length < 2; i++) {
                    if (!blankIndices.includes(i) && cleanWords[i].length > 1) {
                        blankIndices.push(i);
                    }
                }
            }
            
            gameData.blanks = blankIndices;
            gameData.answers = blankIndices.map(i => cleanWords[i]);
            gameData.originalWords = words;
            gameData.score = 0;
            gameData.total = blankIndices.length;
            gameData.hintsUsed = 0;
        }

        function displayVerseWithBlanks() {
            const words = [...gameData.originalWords];
            
            // Replace blanked words with input fields
            gameData.blanks.forEach((blankIndex, i) => {
                const originalWord = words[blankIndex];
                const wordLength = gameData.answers[i].length;
                const placeholder = '_'.repeat(Math.max(3, Math.min(wordLength, 8)));
                
                words[blankIndex] = `<input type="text" class="blank-input" id="blank-${i}" 
                    placeholder="${placeholder}" maxlength="20" 
                    data-answer="${gameData.answers[i]}" data-index="${i}">`;
            });
            
            const verseText = words.join(' ');
            const reference = `${currentVerse.reference}`;
            
            document.getElementById('verseText').innerHTML = verseText;
            document.getElementById('verseReference').textContent = reference;
            
            // Focus on first input
            setTimeout(() => {
                const firstInput = document.getElementById('blank-0');
                if (firstInput) firstInput.focus();
            }, 100);
            
            // Add enter key navigation
            setupInputNavigation();
        }

        function setupInputNavigation() {
            const inputs = document.querySelectorAll('.blank-input');
            inputs.forEach((input, index) => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const nextInput = document.getElementById(`blank-${index + 1}`);
                        if (nextInput) {
                            nextInput.focus();
                        } else {
                            checkAnswers();
                        }
                    }
                });
                
                input.addEventListener('input', function() {
                    // Remove previous styling
                    this.classList.remove('correct', 'incorrect');
                });
            });
        }

        function checkAnswers() {
            // Initialize audio on user interaction
            initAudioContext();
            
            let correct = 0;
            let filled = 0;
            const inputs = document.querySelectorAll('.blank-input');
            
            inputs.forEach(input => {
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswer = input.getAttribute('data-answer');
                
                // Remove previous classes
                input.classList.remove('correct', 'incorrect');
                
                if (userAnswer !== '') {
                    filled++;
                    // Check if answer is correct (allow partial matches for flexibility)
                    if (userAnswer === correctAnswer || 
                        (userAnswer.length > 2 && correctAnswer.includes(userAnswer)) ||
                        (correctAnswer.length > 2 && userAnswer.includes(correctAnswer))) {
                        input.classList.add('correct');
                        correct++;
                    } else {
                        input.classList.add('incorrect');
                    }
                }
            });
            
            gameData.score = correct;
            updateScore();
            
            // Only celebrate if all blanks are filled and all are correct
            if (filled === gameData.total && correct === gameData.total) {
                setTimeout(() => {
                    startTrophyHunt();
                }, 500);
            }
        }

        function startTrophyHunt() {
            const numberOfCupcakes = 4;
            const numberOfUnicorns = 3;
            const totalTargets = 14; // Doubled from 7
            let popped = 0;
            let gameTimeLeft = 10; // Reduced from 20
            let instructionTimeLeft = 3; // Reduced from 5
            
            // Show instruction overlay
            const overlay = document.getElementById('trophyHuntOverlay');
            const huntMessage = document.getElementById('huntMessage');
            const instructionTimer = document.getElementById('instructionTimer');
            const gameTimer = document.getElementById('gameTimer');
            
            overlay.style.display = 'flex';
            
            // Start instruction countdown
            const instructionInterval = setInterval(() => {
                instructionTimeLeft--;
                instructionTimer.textContent = instructionTimeLeft;
                
                if (instructionTimeLeft <= 0) {
                    clearInterval(instructionInterval);
                    startGamePhase();
                }
            }, 1000);
            
            function startGamePhase() {
                // Hide instruction overlay and show game timer
                overlay.style.display = 'none';
                gameTimer.style.display = 'block';
                gameTimer.textContent = gameTimeLeft;
                
                // Start game countdown
                const gameInterval = setInterval(() => {
                    gameTimeLeft--;
                    gameTimer.textContent = gameTimeLeft;
                    
                    if (gameTimeLeft <= 0) {
                        clearInterval(gameInterval);
                        endTrophyHunt(false);
                    }
                }, 1000);
                
                // Store interval for cleanup
                window.currentGameInterval = gameInterval;
                
                // Create emojis in bottom 90% of screen
                createGameEmojis();
            }
            
            function createGameEmojis() {
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                const isMobile = screenWidth <= 768;
                const margin = isMobile ? 40 : 80;
                
                // Constrain to bottom 90% of screen
                const topBoundary = screenHeight * 0.1;
                const usableWidth = screenWidth - (margin * 2);
                const usableHeight = (screenHeight * 0.9) - margin;
                
                // Define emoji pool with safe animations
                const emojiPool = [
                    { emoji: '🧁', animation: 'emoji-spin' },
                    { emoji: '🍪', animation: 'emoji-pop' },
                    { emoji: '🏆', animation: 'emoji-scale' },
                    { emoji: '⭐', animation: 'emoji-sparkle' },
                    { emoji: '🎈', animation: 'emoji-pop' },
                    { emoji: '💎', animation: 'emoji-sparkle' },
                    { emoji: '👑', animation: 'emoji-bounce' },
                    { emoji: '😊', animation: 'emoji-surprise', switchTo: '😲' },
                    { emoji: '🎂', animation: 'emoji-spin' },
                    { emoji: '🌟', animation: 'emoji-sparkle' },
                    { emoji: '🥇', animation: 'emoji-bounce' },
                    { emoji: '🎉', animation: 'emoji-pop' },
                    { emoji: '💩', animation: 'emoji-bounce', isSpecial: true } // Poop emoji
                ];
                
                // Randomly select emojis for this game
                const shuffled = [...emojiPool].sort(() => 0.5 - Math.random());
                const selectedEmojis = [];
                
                // Add poop emoji 10% of the time (at least 1 in 10 games)
                for (let i = 0; i < totalTargets; i++) {
                    if (Math.random() < 0.10 && !selectedEmojis.some(e => e.emoji === '💩')) {
                        selectedEmojis.push(emojiPool.find(e => e.emoji === '💩'));
                    } else {
                        // Select from non-poop emojis
                        const nonPoopEmojis = emojiPool.filter(e => e.emoji !== '💩');
                        const randomIndex = Math.floor(Math.random() * nonPoopEmojis.length);
                        selectedEmojis.push(nonPoopEmojis[randomIndex]);
                    }
                }
                
                // Create emojis
                for (let i = 0; i < totalTargets; i++) {
                    setTimeout(() => {
                        const emojiData = selectedEmojis[i];
                        const emojiElement = document.createElement('div');
                        emojiElement.className = 'dancing-cupcake'; // Reuse existing animation class
                        emojiElement.textContent = emojiData.emoji;
                        
                        // Grid distribution in bottom 90%
                        const cols = isMobile ? 2 : 3;
                        const rows = Math.ceil(totalTargets / cols);
                        const col = i % cols;
                        const row = Math.floor(i / cols);
                        
                        const baseX = margin + (col * (usableWidth / cols));
                        const baseY = topBoundary + (row * (usableHeight / rows));
                        
                        const cellWidth = usableWidth / cols;
                        const cellHeight = usableHeight / rows;
                        const randomX = Math.random() * (cellWidth * 0.6);
                        const randomY = Math.random() * (cellHeight * 0.6);
                        
                        emojiElement.style.left = (baseX + randomX) + 'px';
                        emojiElement.style.top = (baseY + randomY) + 'px';
                        emojiElement.style.animationDelay = Math.random() * 1 + 's';
                        
                        // Add click handler with varied reactions
                        emojiElement.addEventListener('click', function() {
                            if (!this.classList.contains('clicked')) {
                                this.classList.add('clicked');
                                popped++;
                                
                                // Ensure audio is initialized on mobile
                                initAudioContext();
                                
                                // Play sound effect
                                if (emojiData.emoji === '💩') {
                                    playFartSound();
                                } else {
                                    playPopSound();
                                }
                                
                                // Special case for smiley face
                                if (emojiData.switchTo) {
                                    this.textContent = emojiData.switchTo;
                                    setTimeout(() => {
                                        this.classList.add(emojiData.animation);
                                    }, 200);
                                } else if (emojiData.emoji === '💩') {
                                    // Poop emoji gets explosion too
                                    const originalEmoji = this.textContent;
                                    this.textContent = '💥';
                                    setTimeout(() => {
                                        this.textContent = originalEmoji;
                                        this.classList.add(emojiData.animation);
                                    }, 300);
                                } else {
                                    // Add explosion emoji for regular emojis
                                    const originalEmoji = this.textContent;
                                    this.textContent = '💥';
                                    setTimeout(() => {
                                        this.textContent = originalEmoji;
                                        this.classList.add(emojiData.animation);
                                    }, 300);
                                }
                                
                                setTimeout(() => {
                                    if (document.body.contains(this)) {
                                        document.body.removeChild(this);
                                    }
                                }, 800);
                                
                                if (popped === totalTargets) {
                                    clearInterval(window.currentGameInterval);
                                    endTrophyHunt(true);
                                }
                            }
                        });
                        
                        document.body.appendChild(emojiElement);
                    }, i * 200);
                }
                
                // Auto-cleanup after 12 seconds total
                setTimeout(() => {
                    if (window.currentGameInterval) {
                        clearInterval(window.currentGameInterval);
                    }
                    if (popped < totalTargets) {
                        endTrophyHunt(false);
                    }
                }, 12000);
            }
        }

        // Global audio context for mobile compatibility
        let audioContext = null;
        
        // Initialize audio context on first user interaction
        function initAudioContext() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (error) {
                    console.warn('Audio not supported:', error);
                    audioContext = null;
                    return null;
                }
            }
            
            // Always try to resume context (required for mobile)
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    console.log('Audio context resumed');
                }).catch(err => {
                    console.warn('Failed to resume audio context:', err);
                });
            }
            
            return audioContext;
        }

        // Sound effect functions
        function playPopSound() {
            const ctx = initAudioContext();
            if (!ctx) return; // Skip if audio not available
            
            try {
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                oscillator.frequency.setValueAtTime(800, ctx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                
                oscillator.start(ctx.currentTime);
                oscillator.stop(ctx.currentTime + 0.1);
            } catch (error) {
                console.warn('Could not play pop sound:', error);
            }
        }
        
        function playFartSound() {
            const ctx = initAudioContext();
            if (!ctx) return; // Skip if audio not available
            
            try {
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                // Lower frequency for fart sound
                oscillator.frequency.setValueAtTime(100, ctx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(80, ctx.currentTime + 0.3);
                oscillator.type = 'sawtooth'; // More buzzy sound
                
                gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                
                oscillator.start(ctx.currentTime);
                oscillator.stop(ctx.currentTime + 0.3);
            } catch (error) {
                console.warn('Could not play fart sound:', error);
            }
        }

        function endTrophyHunt(success) {
            const overlay = document.getElementById('trophyHuntOverlay');
            const huntMessage = document.getElementById('huntMessage');
            const gameTimer = document.getElementById('gameTimer');
            
            // Hide game timer
            gameTimer.style.display = 'none';
            
            // Show result overlay
            overlay.style.display = 'flex';
            
            if (success) {
                huntMessage.innerHTML = '<div style="font-size: 2em;">🎉 Amazing! You got them all! 🎉</div>';
            } else {
                huntMessage.innerHTML = '<div style="font-size: 1.5em;">⏰ Time\'s up! Great try! ⏰</div>';
            }
            
            // Clean up any remaining emojis
            const remainingEmojis = document.querySelectorAll('.dancing-cupcake, .dancing-unicorn');
            remainingEmojis.forEach(emoji => {
                if (document.body.contains(emoji)) {
                    document.body.removeChild(emoji);
                }
            });
            
            // Clean up interval if still running
            if (window.currentGameInterval) {
                clearInterval(window.currentGameInterval);
                window.currentGameInterval = null;
            }
            
            // Hide overlay after 2 seconds, then automatically start a new game
            setTimeout(() => {
                overlay.style.display = 'none';
                // Reset for next game
                huntMessage.innerHTML = '<div>🏆 Get Ready! 🏆</div><div>Pop all the emojis!</div><div class="instruction-timer" id="instructionTimer">3</div>';
                // Automatically start a new game
                newGame();
            }, 2000);
        }

        function showHint() {
            const inputs = document.querySelectorAll('.blank-input:not(.correct)');
            if (inputs.length > 0) {
                const randomInput = inputs[Math.floor(Math.random() * inputs.length)];
                const answer = randomInput.getAttribute('data-answer');
                randomInput.placeholder = answer.charAt(0) + '_'.repeat(answer.length - 1);
                gameData.hintsUsed++;
            }
        }

        function updateScore() {
            const hintsText = gameData.hintsUsed > 0 ? ` (${gameData.hintsUsed} hints used)` : '';
            document.getElementById('scoreDisplay').textContent = 
                `Score: ${gameData.score} / ${gameData.total}${hintsText}`;
        }

        function newGame() {
            if (!currentVerse) return;
            
            // Clear all existing inputs and their values
            const existingInputs = document.querySelectorAll('.blank-input');
            existingInputs.forEach(input => {
                input.value = '';
                input.classList.remove('correct', 'incorrect');
            });
            
            // Reset game with same verse but different blanks
            setupGameData();
            displayVerseWithBlanks();
            updateScore();
        }

        function clearAllInputs() {
            const inputs = document.querySelectorAll('.blank-input');
            inputs.forEach(input => {
                input.value = '';
                input.classList.remove('correct', 'incorrect');
            });
        }

        function goBackToSearch() {
            // Clear any filled inputs before returning to search
            clearAllInputs();
            
            document.querySelector('.search-section').style.display = 'block';
            document.getElementById('gameSection').style.display = 'none';
            currentVerse = null;
        }

        function showLoading(show) {
            document.getElementById('loadingState').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorState').style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorState').style.display = 'none';
        }

        // Add mobile audio unlock on any touch/click
        function unlockAudioOnMobile() {
            const ctx = initAudioContext();
            if (ctx && ctx.state === 'suspended') {
                ctx.resume();
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Focus on first input
            document.getElementById('bookInput').focus();
            
            // Add mobile audio unlock listeners
            document.addEventListener('touchstart', unlockAudioOnMobile, {once: true});
            document.addEventListener('click', unlockAudioOnMobile, {once: true});
        });
    </script>
